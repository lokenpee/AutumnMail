[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mail"
version = "0.1.2"
description = "Local-first job-search email organizer for 163 mailboxes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tzdata>=2025.2",
]

[tool.setuptools.packages.find]
where = ["src"]
